<!--
  LIYOG WORLD — LiyX AI logo (reusable SVG source)
  Faithful recreation of the provided icon: a green triangulated
  octagonal lattice "shell" with two orbital rings and a glowing
  orange/gold sphere at the center. This file is the canonical source;
  the inline <svg> markup embedded in profile.js's liyxLogoSvg() and
  product-pages-client's copy are generated FROM this file — if the
  logo ever needs to change, update it here first, then re-sync the
  inline copies (kept inline for zero extra network request per
  render, since this icon appears inside many small AI-insight cards
  on a single page).
-->
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="lp-liyx-logo-svg" role="img" aria-label="LiyX AI">
  <defs>
    <radialGradient id="liyxSphereGradient" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF6D6"/>
      <stop offset="45%" stop-color="#FFC24B"/>
      <stop offset="100%" stop-color="#E8590C"/>
    </radialGradient>
  </defs>

  <!-- Orbital rings -->
  <ellipse cx="50" cy="50" rx="44" ry="17" fill="none" stroke="#F5A623" stroke-width="2.2" transform="rotate(-20 50 50)"/>
  <ellipse cx="50" cy="50" rx="44" ry="17" fill="none" stroke="#F5A623" stroke-width="2.2" transform="rotate(20 50 50)"/>

  <!-- Octagonal triangulated shell -->
  <g fill="none" stroke="#1E7A32" stroke-width="1.6" stroke-linejoin="round">
    <polygon points="50,10 68,18 78,32 78,50 68,68 50,78 32,68 22,50 22,32 32,18" />
    <polygon points="50,22 61,27 68,36 68,50 61,61 50,66 39,61 32,50 32,36 39,27" />
    <!-- Radial triangulation lines connecting outer to inner octagon vertices -->
    <line x1="50" y1="10" x2="50" y2="22"/>
    <line x1="68" y1="18" x2="61" y2="27"/>
    <line x1="78" y1="32" x2="68" y2="36"/>
    <line x1="78" y1="50" x2="68" y2="50"/>
    <line x1="68" y1="68" x2="61" y2="61"/>
    <line x1="50" y1="78" x2="50" y2="66"/>
    <line x1="32" y1="68" x2="39" y2="61"/>
    <line x1="22" y1="50" x2="32" y2="50"/>
    <line x1="22" y1="32" x2="32" y2="36"/>
    <line x1="32" y1="18" x2="39" y2="27"/>
    <!-- Cross-bracing for the faceted look -->
    <line x1="50" y1="10" x2="61" y2="27"/>
    <line x1="68" y1="18" x2="68" y2="36"/>
    <line x1="78" y1="32" x2="68" y2="50"/>
    <line x1="78" y1="50" x2="61" y2="61"/>
    <line x1="68" y1="68" x2="50" y2="66"/>
    <line x1="50" y1="78" x2="39" y2="61"/>
    <line x1="32" y1="68" x2="32" y2="50"/>
    <line x1="22" y1="50" x2="32" y2="36"/>
    <line x1="22" y1="32" x2="39" y2="27"/>
    <line x1="32" y1="18" x2="50" y2="22"/>
  </g>

  <!-- Glowing center sphere -->
  <circle cx="50" cy="50" r="15" fill="url(#liyxSphereGradient)"/>
</svg>
